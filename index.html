<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
  <meta name="theme-color" content="#0A784C">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="description" content="IEM GROUP — Sugerencia de pedido (vendedores)">
  <title>IEM · Pedidos vendedor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="stylesheet" href="vendedores.css?v=2.1">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <!-- LOGIN (mismo estilo que inventario) -->
  <div id="loginScreen" class="login-wrap">
    <div class="card login-card">
      <div class="login-logo">
        <img src="logo-iem.png" alt="IEM GROUP · Laive" width="160" height="auto">
      </div>
      <h1>Pedidos vendedor</h1>
      <p class="sub">Sugerencia de pedido · IEM GROUP</p>
      <div class="field">
        <label for="vUser">Usuario (código)</label>
        <input id="vUser" type="text" inputmode="numeric" autocomplete="username" placeholder="Ej. 400">
      </div>
      <div class="field">
        <label for="vPass">Clave</label>
        <input id="vPass" type="password" autocomplete="current-password" placeholder="••••">
      </div>
      <button type="button" class="btn btn-primary" id="vLoginBtn">Entrar</button>
      <p class="muted" style="margin-top:0.75rem;text-align:center;font-size:0.78rem;">Misma cuenta Auth que inventario (rol vendedor)</p>
    </div>
  </div>

  <!-- APP -->
  <div id="appScreen" class="container hidden">
    <div class="header-bar">
      <div class="who" id="vWho">—</div>
      <button type="button" class="btn btn-outline" id="vLogoutBtn">Salir</button>
    </div>

    <div class="card">
      <div class="filtros" id="vFiltros">
        <button type="button" class="filtro-btn active" data-tipo="">Todos</button>
        <button type="button" class="filtro-btn" data-tipo="FRIOS">Fríos</button>
        <button type="button" class="filtro-btn" data-tipo="SECOS">Secos</button>
      </div>
      <div class="search-row">
        <input type="search" id="vSearch" placeholder="Código o nombre…" autocomplete="off" enterkeyhint="search">
      </div>
      <div class="catalog-count" id="vCatalogCount">Catálogo: —</div>
      <div class="result-list" id="vResults"></div>
    </div>

    <div class="producto-card hidden" id="vProductoCard">
      <div class="pc-name" id="vProdName">—</div>
      <div class="pc-codes" id="vProdCodes">Cód: — · Cód. Fábrica: —</div>
      <div class="qty-row">
        <div class="field">
          <label for="vCajas">Cajas</label>
          <input id="vCajas" type="number" min="0" step="1" value="0" inputmode="numeric">
        </div>
        <div class="field">
          <label for="vUnidades">Unidades</label>
          <input id="vUnidades" type="number" min="0" step="1" value="0" inputmode="numeric">
        </div>
      </div>
      <p class="muted" id="vFactor">Factor: —</p>
      <div class="pc-actions" style="display:flex;gap:0.5rem;flex-wrap:wrap;">
        <button type="button" class="btn btn-success" id="vAddBtn" style="flex:1;">Agregar al pedido</button>
        <button type="button" class="btn btn-outline" id="vClearProd" style="flex:1;">← Cambiar producto</button>
      </div>
    </div>

    <div class="card">
      <h2 style="font-size:1rem;margin-bottom:0.55rem;">Pedido sugerido</h2>
      <div class="pedido-list" id="vPedidoList">
        <p class="muted">Aún no hay productos.</p>
      </div>
      <div class="totales" id="vTotales">0 cajas · 0 unidades</div>
      <div class="field">
        <label for="vNotas">Notas (opcional)</label>
        <textarea id="vNotas" placeholder="Observaciones para almacén…"></textarea>
      </div>
      <button type="button" class="btn btn-primary" id="vSendBtn">Enviar sugerencia</button>
    </div>
  </div>

  <div id="vToast" class="toast hidden"></div>

  <script src="config.js"></script>
  <script src="app-vendedores.js?v=2.1"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function (regs) {
        regs.forEach(function (r) { r.unregister(); });
      }).catch(function () {});
    }
  </script>
</body>
</html>
